name: tests

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make CC=${{ matrix.cc }} test
      - name: No allocation on the hot path
        run: make CC=${{ matrix.cc }} alloc-test
      - name: Python binding
        run: make CC=${{ matrix.cc }} python-test
      # M5c: built with everything else, then a short run whose numbers are
      # printed, not gated -- shared runners are too noisy for a threshold.
      - name: Exchange benchmark (printed, not gated)
        run: make CC=${{ matrix.cc }} exchange-bench BENCH_ARGS="-p 2 -n 20000"

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test with ASan/UBSan
        run: make asan

  # M5b: the gateway threads under ThreadSanitizer. ASLR is turned off
  # because TSan aborts on some kernels' high-entropy address layouts.
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gateway tests with TSan
        run: setarch "$(uname -m)" -R make tsan

  # M2 on a real trading day. The sample is fetched from LOBSTER at
  # run time rather than committed; a download failure fails the job
  # rather than skipping it.
  lobster-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch LOBSTER AAPL sample (2012-06-21, 10 levels)
        run: make fetch-lobster
      - name: Replay
        run: make replay
      # M3: per-message latency on the same day. Printed, not gated --
      # shared runners are too noisy for a timing threshold.
      - name: Latency
        run: make replay-bench
